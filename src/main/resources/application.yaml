spring:
  application:
    name: agro-guard
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/agro-guard
    username: ${ENV_POSTGRES_USER}
    password: ${ENV_POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 20
  port: 8080