spring:
  application:
    name: agro-guard
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/agro-guard
    username: ${ENV_POSTGRES_USER}
    password: ${ENV_POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

app:
  jwt:
    secret: ${ENV_JWT_SECRET}
    expiration-minutes: 120
  cors:
    allowed-origin: http://localhost:5173

server:
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 20
  port: 8080
